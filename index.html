<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Odysseus</title>

    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <!-- FORWARD VIDEO -->
    <video
      id="bg-video-forward"
      class="bg-video active"
      autoplay
      muted
      playsinline
      preload="auto"
    >
      <source src="./video/odysseus video.mp4" type="video/mp4" />
    </video>

    <!-- REVERSE VIDEO -->
    <video
      id="bg-video-reverse"
      class="bg-video"
      muted
      playsinline
      preload="auto"
    >
      <source src="./video/odysseus reverse.mp4" type="video/mp4" />
    </video>

    <aside id="controller">
      <div class="controller-title">ODYSSEUS</div>

      <div class="control-row">
        <button
          class="control-label mode-button active-mode"
          id="kr-label"
          type="button"
        >
          KR
        </button>

        <button class="switch-button" id="kr-switch" type="button">
          <span class="switch">
            <span class="switch-knob"></span>
          </span>
        </button>
      </div>

      <div class="control-row">
        <button class="control-label mode-button" id="en-label" type="button">
          EN
        </button>

        <button class="switch-button" id="en-switch" type="button">
          <span class="switch">
            <span class="switch-knob"></span>
          </span>
        </button>
      </div>

      <div class="control-row">
        <span class="control-label mu-label"> Mu </span>

        <button class="switch-button" id="music-switch" type="button">
          <span class="switch">
            <span class="switch-knob"></span>
          </span>
        </button>
      </div>
    </aside>

    <main id="svg-container" class="is-loading"></main>

    <audio id="music" src="./audio/The Bow.mp3" preload="auto" loop></audio>

    <script src="./script.js"></script>
  </body>
</html>
